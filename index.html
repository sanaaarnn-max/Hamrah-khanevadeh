<title>همراه خانواده</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:#fff;
  color:#333
}
.container{
  max-width:1100px;
  margin:auto;
  padding:18px
}
.header{
  background:#f8c9dc;
  border-radius:24px;
  padding:25px;
  text-align:center;
  box-shadow:0 8px 25px rgba(180,80,120,.12)
}
.header h1{
  margin:0 0 8px;
  font-size:30px;
  color:#222
}
.header p{
  margin:6px 0;
  color:#333
}
.demo{
  display:inline-block;
  margin-top:8px;
  padding:6px 15px;
  border-radius:20px;
  background:#fff;
  color:#222;
  font-size:13px
}
.card{
  background:#fff;
  border:1px solid #f0d9e3;
  border-radius:20px;
  padding:20px;
  margin-top:18px;
  box-shadow:0 6px 20px rgba(180,80,120,.08)
}
.login-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px
}
.login-box{
  background:#fff7fa;
  border:1px solid #f0d9e3;
  border-radius:18px;
  padding:18px
}
input,select,textarea{
  width:100%;
  padding:12px;
  margin:5px 0 10px;
  border:1px solid #decbd4;
  border-radius:12px;
  background:#fff;
  font-family:inherit
}
button{
  border:0;
  border-radius:12px;
  padding:10px 15px;
  font-family:inherit;
  cursor:pointer
}
.primary{
  background:#df82a8;
  color:#fff
}
.secondary{
  background:#f6e0e9;
  color:#733c53
}
.danger{
  background:#d95772;
  color:#fff
}
.nav{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:16px 0
}
.nav button{
  background:#fbe7ef;
  color:#70394f
}
.nav button.active{
  background:#df82a8;
  color:white
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap
}
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px
}
.stat{
  background:#fff8fa;
  border:1px solid #f0dbe3;
  border-radius:16px;
  padding:18px;
  text-align:center
}
.stat b{
  display:block;
  margin-top:7px;
  color:#c75b82;
  font-size:23px
}
.list{
  display:grid;
  gap:10px
}
.item{
  background:#fff8fa;
  border:1px solid #f0dbe3;
  border-radius:15px;
  padding:14px
}
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap
}
.chips{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:10px 0
}
.chip{
  background:#f7dce6;
  border-radius:20px;
  padding:6px 10px;
  font-size:12px
}
.notice{
  background:#fff7ce;
  border:1px solid #efdfa0;
  border-radius:13px;
  padding:13px;
  margin:12px 0
}
.table-wrap{
  overflow:auto
}
table{
  width:100%;
  min-width:650px;
  border-collapse:collapse
}
th,td{
  padding:10px;
  border-bottom:1px solid #eddce3;
  text-align:right
}
th{
  background:#fbe7ef
}
.small{
  font-size:12px;
  color:#777
}
.empty{
  text-align:center;
  color:#888;
  padding:25px
}
.hidden{
  display:none!important
}
.footer{
  text-align:center;
  color:#999;
  font-size:12px;
  padding:22px
}
@media(max-width:800px){
  .login-grid,
  .stats{
    grid-template-columns:1fr
  }
  .container{
    padding:10px
  }
  .header h1{
    font-size:25px
  }
}
</style>

function loadData(){

 try{

  const saved=localStorage.getItem(STORAGE_KEY);

  if(saved){

   const parsed=JSON.parse(saved);

   return {
    ...defaultData,
    ...parsed,
    teachers:parsed.teachers || defaultTeachers,
    announcements:parsed.announcements || [],
    requests:parsed.requests || [],
    messages:parsed.messages || [],
    calendar:parsed.calendar || [],
    records:parsed.records || {}
   };

  }

 }catch(e){}

 return JSON.parse(JSON.stringify(defaultData));
}


function saveData(){

  STORAGE_KEY,
  JSON.stringify(data)
 );

}


function normalize(value){

 return String(value || "")
 .replace(/[۰-۹]/g,function(d){
   return "۰۱۲۳۴۵۶۷۸۹".indexOf(d);
 })
 .replace(/\s/g,"")
 .trim();

}


function escapeHTML(value){

 return String(value || "")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");

}


function gradeName(g){

 return "پایه "+g+" ابتدایی";

}

function parentLogin(){

}

function showLoginError(message){

 .getElementById("loginPage")
 .classList.add("hidden");

   ["students","👩‍🎓 دانش‌آموزان من"],
   ["sendMessage","💬 پیام به خانواده"],
   ["announcements","📢 اطلاعیه‌ها"]

  ];

 }


 return [

  ["home","🏠 داشبورد"],
  ["students","👩‍🎓 مدیریت دانش‌آموزان"],
  ["teachers","👩‍🏫 مدیریت معلمان"],
  ["announcements","📢 اطلاعیه‌ها"],
  ["requests","📝 درخواست‌ها"],
  ["messages","💬 پیام‌ها"],
  ["calendar","📅 تقویم مدرسه"],
  ["report","📊 گزارش مدیر"]

 ];

}


function goTo(page){

 currentPage=page;

 render();

}


function render(){

 const welcome=document.getElementById("welcomeText");

 const role=document.getElementById("roleText");

 if(currentUser.type==="parent"){

  welcome.textContent=
   "سلام "+currentUser.student.name+" 🌷";

  role.textContent="پنل والدین";

 }

 else if(currentUser.type==="teacher"){

  welcome.textContent=
   "سلام "+currentUser.teacher.name+" 🌷";

  role.textContent="پنل معلم";

 }

 else{

  welcome.textContent="سلام مدیر مدرسه 🌷";

  role.textContent="پنل مدیریت";

 }


 const nav=document.getElementById("navigation");

 nav.innerHTML=getNavigation().map(function(item){

  return `
   <button
    class="${currentPage===item[0]?"active":""}"
    onclick="goTo('${item[0]}')">
    ${item[1]}
   </button>
  `;

 }).join("");


 const pages={

  home:renderHome,
  study:renderStudy,
  messages:renderParentMessages,
  request:renderRequest,
  announcements:renderAnnouncements,
  calendar:renderCalendar,
  students:renderStudents,
  sendMessage:renderSendMessage,
  teachers:renderTeachers,
  requests:renderRequests,
  report:renderReport

 };

 document.getElementById("content").innerHTML=
  (pages[currentPage]||renderHome)();

}
