<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>همراه خانواده</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial;background:linear-gradient(135deg,#fff7fb,#f8fbff);color:#333}
header{background:linear-gradient(135deg,#f7bfd6,#fce4ee);padding:28px 15px;text-align:center;box-shadow:0 3px 15px #ddd}
header h1{margin:0;color:#222;font-size:30px}
header p{margin:8px 0 3px;color:#333}
.school{font-weight:bold;color:#555}
.demo{display:inline-block;margin-top:10px;background:#fff;color:#222;padding:6px 14px;border-radius:20px;font-size:12px}
.container{max-width:1050px;margin:25px auto;padding:15px}
.card{background:white;border-radius:22px;padding:22px;margin-bottom:18px;box-shadow:0 5px 20px #e8e8e8}
h2,h3{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
button{border:0;border-radius:14px;padding:12px 18px;cursor:pointer;font-family:inherit;font-size:15px;background:#efb1cd;color:#222;font-weight:bold}
button:hover{filter:brightness(.96)}
input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;font-family:inherit;margin:6px 0 12px;background:#fff}
.hidden{display:none!important}
.role{padding:22px;text-align:center}
.role button{width:100%;margin:7px 0}
.nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.nav button{background:#f7d8e6;font-size:13px}
.item{padding:15px;border:1px solid #eee;border-radius:15px;margin:9px 0;background:#fff}
.badge{display:inline-block;padding:4px 9px;border-radius:20px;background:#e7f2ff;font-size:12px;margin:3px}
.danger{background:#ffd6d6}
.success{background:#dff5e7}
.blue{background:#dceeff}
.pink{background:#ffe0ed}
.center{text-align:center}
.back{background:#eee}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:9px;border-bottom:1px solid #eee;text-align:right}
small{color:#777}
</style>
</head>

<body>

<header>
<h1>🌱 همراه خانواده</h1>
<p>سامانه هوشمند ارتباط مدرسه و خانواده</p>
<div class="school">دبستان دخترانه امام حسین (ع) ، سرخس</div>
<div class="demo">نسخه نمایشی</div>
</header>

<div class="container">

<!-- HOME -->
<section id="home" class="card">
<h2 class="center">ورود به سامانه</h2>
<div class="grid role">
<button onclick="showLogin('parent')">👨‍👩‍👧 ورود والدین</button>
<button onclick="showLogin('teacher')">👩‍🏫 ورود معلمان</button>
<button onclick="showLogin('admin')">👩‍💼 ورود مدیر</button>
</div>
</section>

<!-- LOGIN -->
<section id="login" class="card hidden">
<h2 id="loginTitle"></h2>
<label>نام کاربری</label>
<input id="username" autocomplete="off">
<label>رمز عبور</label>
<input id="password" type="password">
<button onclick="login()">ورود</button>
<button class="back" onclick="goHome()">بازگشت</button>
<p id="loginError" style="color:#d33"></p>
</section>

<!-- PANEL -->
<section id="panel" class="hidden">
<div class="card">
<h2 id="panelTitle"></h2>
<div class="nav" id="nav"></div>
<button class="back" onclick="logout()">خروج</button>
</div>
<div id="content"></div>
</section>

</div>

function showLogin(r){
role=r;
document.getElementById("home").classList.add("hidden");
document.getElementById("login").classList.remove("hidden");
document.getElementById("username").value="";
document.getElementById("password").value="";
document.getElementById("loginError").textContent="";

r==="teacher"?"👩‍🏫 ورود معلم":"👩‍💼 ورود مدیر";
}

function goHome(){
document.getElementById("login").classList.add("hidden");
document.getElementById("home").classList.remove("hidden");
}

function login(){
const u=document.getElementById("username").value.trim();
const p=document.getElementById("password").value.trim();

if(role==="admin"){
if(u===admin.u && p===admin.p){
currentUser=admin;
openPanel();
return;
}
}

if(role==="teacher"){
const t=teachers.find(x=>x.u===u && x.p===p);
if(t){
currentUser=t;
openPanel();
return;
}
}

if(role==="parent"){
const s=studentsData.find(x=>x.code===u && x.code===p);
if(s){
currentUser=s;
openPanel();
return;
}
}

document.getElementById("loginError").textContent="نام کاربری یا رمز عبور صحیح نیست.";
}

function openPanel(){
document.getElementById("login").classList.add("hidden");
document.getElementById("panel").classList.remove("hidden");

document.getElementById("panelTitle").textContent=
role==="admin"?"👩‍💼 پنل مدیریت":
role==="teacher"?"👩‍🏫 "+currentUser.name:
"👨‍👩‍👧 پنل خانواده | "+currentUser.name;

let nav=document.getElementById("nav");

if(role==="parent"){
nav.innerHTML=`
<button onclick="parentHome()">🏠 داشبورد</button>
<button onclick="parentStudy()">📚 وضعیت تحصیلی</button>
<button onclick="parentMessages()">💬 پیام‌های مدرسه</button>
<button onclick="parentRequest()">📨 درخواست به مدرسه</button>
<button onclick="showAnnouncements()">📢 اطلاعیه‌های مدرسه</button>
<button onclick="schoolCalendar()">📅 تقویم مدرسه</button>`;
parentHome();
}

<button onclick="teacherMessage()">💬 پیام به خانواده</button>

<button onclick="schoolCalendar()">📅 تقویم مدرسه</button>`;
adminHome();
}

function logout(){
currentUser=null;
role="";
document.getElementById("panel").classList.add("hidden");
document.getElementById("home").classList.remove("hidden");
}

<h2>سلام 🌷</h2>

}

function parentStudy(){

<div class="item">ریاضی<br><b>${s.math}</b></div>

</div>

function parentMessages(){
const arr=messages.filter(m=>m.studentId===currentUser.id);
document.getElementById("content").innerHTML=`
<div class="card">
<h2>💬 پیام‌های مدرسه</h2>
${arr.length?arr.map(m=>`
<div class="item">
<b>${m.teacher}</b>
<p>${m.text}</p>
<small>${m.date}</small>
</div>`).join(""):"<p>پیامی برای شما ثبت نشده است.</p>"}
</div>`;
}

function parentRequest(){
document.getElementById("content").innerHTML=`
<div class="card">
<h2>📨 درخواست به مدرسه</h2>
<textarea id="requestText" placeholder="متن درخواست خود را بنویسید..."></textarea>
<button onclick="sendRequest()">ثبت درخواست</button>
</div>`;
}

function sendRequest(){
const text=document.getElementById("requestText").value.trim();
if(!text)return alert("متن درخواست را وارد کنید.");
requests.push({
id:Date.now(),
student:currentUser.name,
studentId:currentUser.id,
text,
status:"در انتظار بررسی"
});
save();
alert("درخواست شما ثبت شد 🌷");
parentRequest();
}

function showAnnouncements(){
document.getElementById("content").innerHTML=`
<div class="card">
<h2>📢 اطلاعیه‌های مدرسه</h2>
${announcements.length?announcements.slice().reverse().map(a=>`
<div class="item">
<h3>${a.title}</h3>
<p>${a.text}</p>
<small>${a.date}</small>
</div>`).join(""):"<p>اطلاعیه‌ای ثبت نشده است.</p>"}
</div>`;
}

function schoolCalendar(){
document.getElementById("content").innerHTML=`
<div class="card">
<h2>📅 تقویم مدرسه</h2>
<div class="item">🗓️ برنامه‌های مدرسه در این بخش نمایش داده می‌شود.</div>
</div>`;
}
