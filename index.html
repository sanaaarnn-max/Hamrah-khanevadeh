<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>همراه خانواده</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:
linear-gradient(135deg,#e3f2fd,#f1f8e9);
color:#263238;
min-height:100vh;
}

.container{
max-width:520px;
margin:auto;
padding:22px 16px 40px;
}

.header{
background:linear-gradient(135deg,#1565c0,#1976d2);
color:white;
padding:28px 20px;
border-radius:25px;
box-shadow:0 8px 25px #0002;
margin-bottom:20px;
}

.header h1{
margin:0;
font-size:30px;
}

.header p{
margin:10px 0 0;
font-size:14px;
opacity:.9;
}

.card,.panel{
background:white;
padding:20px;
margin:14px 0;
border-radius:20px;
box-shadow:0 5px 20px #0001;
}

.card{
transition:.2s;
}

.card:active{
transform:scale(.98);
}

.card h2{
margin:5px 0 8px;
}

.card p{
color:#607d8b;
font-size:14px;
}

.role-icon{
font-size:38px;
margin-bottom:5px;
}

button{
width:100%;
padding:14px;
margin-top:10px;
border:0;
border-radius:13px;
background:#1976d2;
color:white;
font-size:16px;
font-family:Tahoma;
cursor:pointer;
box-shadow:0 3px 8px #0002;
}

button:active{
transform:scale(.98);
}

.green{
background:#43a047;
}

.gray{
background:#78909c;
}

textarea,
select{
width:100%;
padding:13px;
margin:8px 0;
border:1px solid #dce3e8;
border-radius:12px;
font-family:Tahoma;
font-size:14px;
background:white;
}

textarea{
height:95px;
resize:none;
}

select{
height:48px;
}

.notice{
background:#f1f8e9;
padding:15px;
border-radius:13px;
margin-top:10px;
text-align:right;
line-height:1.9;
}

.student{
background:#e3f2fd;
padding:15px;
border-radius:14px;
margin-top:10px;
text-align:right;
line-height:1.9;
}

.message{
background:#fff8e1;
padding:15px;
border-radius:14px;
margin-top:10px;
text-align:right;
line-height:1.9;
}

.infoBox{
background:#f7f9fb;
padding:16px;
border-radius:14px;
margin-top:10px;
text-align:right;
line-height:2;
}

.label{
font-weight:bold;
color:#1565c0;
}

.dashboard{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:15px;
}

.stat{
background:#f7f9fb;
padding:18px 10px;
border-radius:17px;
box-shadow:0 3px 12px #0001;
}

.stat .icon{
font-size:28px;
}

.stat .number{
font-size:27px;
font-weight:bold;
color:#1565c0;
margin:7px 0;
}

.stat .title{
font-size:13px;
color:#607d8b;
}

.status{
background:#e8f5e9;
padding:15px;
border-radius:14px;
margin-top:15px;
font-weight:bold;
color:#2e7d32;
}

.notification{
background:#fff3e0;
border-right:5px solid #fb8c00;
padding:15px;
border-radius:13px;
margin-top:10px;
text-align:right;
line-height:1.9;
}

.badge{
display:inline-block;
background:#e53935;
color:white;
border-radius:20px;
padding:3px 8px;
font-size:11px;
margin-right:5px;
}

.footer{
text-align:center;
color:#78909c;
font-size:12px;
margin-top:25px;
}

</style>
</head>

<body>

<div class="container">

<div class="header">

<h1>🌱 همراه خانواده</h1>

<p>
سامانه هوشمند ارتباط مدرسه و خانواده
</p>

</div>


<div id="home">

<div class="card">

<div class="role-icon">👨‍👩‍👧</div>

<h2>والدین</h2>

<p>
پیگیری وضعیت آموزشی و ارتباط مستقیم با مدرسه
</p>

<button onclick="login('parent')">
ورود والدین
</button>

</div>


<div class="card">

<div class="role-icon">👩‍🏫</div>

<h2>معلمان</h2>

<p>
مدیریت دانش‌آموزان و ارتباط با خانواده‌ها
</p>

<button onclick="login('teacher')">
ورود معلمان
</button>

</div>


<div class="card">

<div class="role-icon">👩‍💼</div>

<h2>مدیریت مدرسه</h2>

<p>
مدیریت ارتباطات، اطلاعیه‌ها و درخواست‌ها
</p>

<button onclick="login('admin')">
ورود مدیریت
</button>

</div>

</div>


<div id="panel" class="panel" style="display:none"></div>


<div class="footer">
نسخه نمایشی سامانه «همراه خانواده»
</div>

</div>


<script>

/* =========================
اطلاعات
========================= */

let requests =
JSON.parse(localStorage.getItem("school_requests")) || [];

let announcements =
JSON.parse(localStorage.getItem("school_announcements")) || [
"جلسه اولیا و مربیان به‌زودی برگزار می‌شود."
];

let students =
JSON.parse(localStorage.getItem("school_students")) || [

{
name:"آرین محمدی",
className:"سوم الف",
status:"فعال",
grade:"عالی",
attendance:"حاضر",
math:"عالی",
reading:"خوب",
behavior:"بسیار خوب"
},

{
name:"سارا احمدی",
className:"سوم الف",
status:"فعال",
grade:"خوب",
attendance:"حاضر",
math:"خوب",
reading:"عالی",
behavior:"خوب"
},

{
name:"پارسا رضایی",
className:"سوم الف",
status:"فعال",
grade:"نیازمند توجه",
attendance:"حاضر",
math:"متوسط",
reading:"خوب",
behavior:"خوب"
}

];

let familyMessages =
JSON.parse(localStorage.getItem("school_messages")) || [];

let notifications =
JSON.parse(localStorage.getItem("school_notifications")) || [

{
type:"اطلاعیه",
text:"جلسه اولیا و مربیان به‌زودی برگزار می‌شود."
}

];


/* =========================
ذخیره
========================= */

function saveData(){

localStorage.setItem(
"school_requests",
JSON.stringify(requests)
);

localStorage.setItem(
"school_announcements",
JSON.stringify(announcements)
);

localStorage.setItem(
"school_students",
JSON.stringify(students)
);

localStorage.setItem(
"school_messages",
JSON.stringify(familyMessages)
);

localStorage.setItem(
"school_notifications",
JSON.stringify(notifications)
);

}


/* =========================
ورود
========================= */

function login(type){

let roleName="";
let roleIcon="";

if(type==="parent"){
roleName="والدین";
roleIcon="👨‍👩‍👧";
}

if(type==="teacher"){
roleName="معلم";
roleIcon="👩‍🏫";
}

if(type==="admin"){
roleName="مدیریت مدرسه";
roleIcon="👩‍💼";
}

let name=prompt(
"ورود به سامانه همراه خانواده\n\n"+
roleIcon+" "+roleName+
"\n\nنام کاربری را وارد کنید:"
);

if(!name || name.trim()===""){
alert("لطفاً نام کاربری را وارد کنید.");
return;
}

let panel=document.getElementById("panel");


if(type==="parent"){

panel.innerHTML=`

<h2>👨‍👩‍👧 پنل والدین</h2>

<p>
خوش آمدید <b>${name}</b> 🌷
</p>

<button onclick="showNotifications()">
🔔 اعلان‌ها ${notificationBadge()}
</button>

<button onclick="showNotice()">
📢 اطلاعیه‌های مدرسه
</button>

<button onclick="showStudent()">
📚 اطلاعات آموزشی دانش‌آموز
</button>

<button onclick="showParentMessages()">
💬 پیام‌های معلم ${messageBadge()}
</button>

<button onclick="requestBox()">
📩 درخواست به مدرسه
</button>

<button class="gray" onclick="backHome()">
🚪 خروج از حساب
</button>

<div id="inside"></div>
`;

}


if(type==="teacher"){

panel.innerHTML=`

<h2>👩‍🏫 پنل معلم</h2>

<p>
خوش آمدید <b>${name}</b> 🌷
</p>

<button onclick="showNotifications()">
🔔 اعلان‌ها ${notificationBadge()}
</button>

<button onclick="showNotice()">
📢 اطلاعیه‌ها
</button>

<button onclick="showStudents()">
📚 دانش‌آموزان
</button>

<button onclick="showFamilyMessages()">
👨‍👩‍👧 ارتباط با خانواده
</button>

<button class="gray" onclick="backHome()">
🚪 خروج از حساب
</button>

<div id="inside"></div>
`;

}


if(type==="admin"){

panel.innerHTML=`

<h2>👩‍💼 پنل مدیریت مدرسه</h2>

<p>
خوش آمدید <b>${name}</b> 🌷
</p>

<button onclick="showNotifications()">
🔔 اعلان‌ها ${notificationBadge()}
</button>

<button onclick="showNotice()">
📢 اطلاعیه‌های مدرسه
</button>

<button onclick="showRequests()">
📩 درخواست‌های والدین
</button>

<button onclick="showDashboard()">
📊 داشبورد مدیریت
</button>

<button onclick="addAnnouncement()">
📝 ثبت اطلاعیه جدید
</button>

<button class="gray" onclick="backHome()">
🚪 خروج از حساب
</button>

<div id="inside"></div>
`;

}

document.getElementById("home").style.display="none";

panel.style.display="block";

}


/* =========================
اعلان
========================= */

function notificationBadge(){

if(notifications.length===0){
return "";
}

return `<span class="badge">${notifications.length}</span>`;
}


function messageBadge(){

if(familyMessages.length===0){
return "";
}

return `<span class="badge">${familyMessages.length}</span>`;
}


function showNotifications(){

let html="<h3>🔔 اعلان‌های جدید</h3>";

if(notifications.length===0){

html+=`

<div class="notice">
📭 اعلان جدیدی وجود ندارد.
</div>

`;

}else{

for(let i=0;i<notifications.length;i++){

html+=`

<div class="notification">

<b>🔔 ${notifications[i].type}</b>

<br><br>

${notifications[i].text}

</div>

`;
}

html+=`

<button class="gray" onclick="clearNotifications()">
خواندم ✓
</button>
`;

}

document.getElementById("inside").innerHTML=html;

}


function clearNotifications(){

notifications=[];

saveData();

alert("اعلان‌ها خوانده شدند ✅");

showNotifications();

}


/* =========================
اطلاعیه
========================= */

function showNotice(){

let html="<h3>📢 اطلاعیه‌های مدرسه</h3>";

for(let i=0;i<announcements.length;i++){

html+=`

<div class="notice">

<b>اطلاعیه ${i+1}</b>

<br><br>

${announcements[i]}

</div>

`;
}

document.getElementById("inside").innerHTML=html;

}


/* =========================
دانش‌آموز
========================= */

function showStudent(){

let s=students[0];

document.getElementById("inside").innerHTML=`

<h3>📚 پرونده آموزشی دانش‌آموز</h3>

<div class="infoBox">

<div>
<span class="label">👤 نام:</span>
${s.name}
</div>

<div>
<span class="label">🏫 کلاس:</span>
${s.className}
</div>

<div>
<span class="label">✅ وضعیت:</span>
${s.status}
</div>

<div>
<span class="label">📊 ارزیابی:</span>
${s.grade}
</div>

<div>
<span class="label">🕐 حضور:</span>
${s.attendance}
</div>

</div>

<h3>📖 ارزیابی درسی</h3>

<div class="notice">

➗ ریاضی:
<b>${s.math}</b>

<br><br>

📚 خواندن و فارسی:
<b>${s.reading}</b>

<br><br>

🌱 رفتار و مشارکت:
<b>${s.behavior}</b>

</div>

`;

}


/* =========================
فهرست دانش‌آموزان
========================= */

function showStudents(){

let html=`

<h3>📚 فهرست دانش‌آموزان</h3>

<p>کلاس سوم الف</p>

`;

for(let i=0;i<students.length;i++){

html+=`

<div class="student">

<b>${students[i].name}</b>

<br>

کلاس: ${students[i].className}

<br>

وضعیت: ${students[i].status}

<br>

ارزیابی: ${students[i].grade}

<button onclick="studentInfo(${i})">
مشاهده پرونده
</button>

</div>

`;

}

document.getElementById("inside").innerHTML=html;

}


function studentInfo(index){

let s=students[index];

document.getElementById("inside").innerHTML=`

<h3>📋 پرونده دانش‌آموز</h3>

<div class="infoBox">

<b>👤 نام:</b>
${s.name}

<br>

<b>🏫 کلاس:</b>
${s.className}

<br>

<b>✅ وضعیت:</b>
${s.status}

<br>

<b>📊 ارزیابی:</b>
${s.grade}

<br>

<b>🕐 حضور:</b>
${s.attendance}

</div>

<div class="notice">

➗ ریاضی: ${s.math}

<br><br>

📚 خواندن و فارسی: ${s.reading}

<br><br>

🌱 رفتار و مشارکت: ${s.behavior}

</div>

<button onclick="showStudents()">
بازگشت به فهرست
</button>

`;

}


/* =========================
ارتباط خانواده
========================= */

function showFamilyMessages(){

let html=`

<h3>👨‍👩‍👧 ارتباط با خانواده</h3>

<select id="familyStudent">

<option value="">
انتخاب دانش‌آموز
</option>

`;

for(let i=0;i<students.length;i++){

html+=`

<option value="${i}">
${students[i].name} - ${students[i].className}
</option>

`;

}

html+=`

</select>

<textarea
id="familyMessage"
placeholder="پیام خود را برای خانواده بنویسید...">
</textarea>

<button class="green" onclick="sendFamilyMessage()">
ارسال پیام
</button>

`;

if(familyMessages.length>0){

html+=`<h3>📨 پیام‌های ثبت‌شده</h3>`;

for(let i=0;i<familyMessages.length;i++){

html+=`

<div class="message">

<b>${familyMessages[i].student}</b>

<br><br>

${familyMessages[i].text}

</div>

`;
}

}

document.getElementById("inside").innerHTML=html;

}


function sendFamilyMessage(){

let studentIndex=
document.getElementById("familyStudent").value;

let message=
document.getElementById("familyMessage").value.trim();

if(studentIndex===""){

alert("لطفاً دانش‌آموز را انتخاب کنید.");

return;
}

if(!message){

alert("لطفاً متن پیام را وارد کنید.");

return;
}

familyMessages.push({

student:students[studentIndex].name,

text:message

});

notifications.push({

type:"پیام جدید",

text:"یک پیام جدید از طرف معلم ثبت شد."

});

saveData();

alert("پیام با موفقیت ثبت شد ✅");

showFamilyMessages();

}


/* =========================
پیام والدین
========================= */

function showParentMessages(){

if(familyMessages.length===0){

document.getElementById("inside").innerHTML=`

<div class="notice">

📭 هنوز پیامی از طرف معلم ثبت نشده است.

</div>

`;

return;
}

let html="<h3>💬 پیام‌های معلم</h3>";

for(let i=0;i<familyMessages.length;i++){

html+=`

<div class="message">

<b>
👩‍🏫 پیام برای ${familyMessages[i].student}
</b>

<br><br>

${familyMessages[i].text}

</div>

`;
}

document.getElementById("inside").innerHTML=html;

}


/* =========================
اطلاعیه جدید
========================= */

function addAnnouncement(){

document.getElementById("inside").innerHTML=`

<h3>📝 ثبت اطلاعیه جدید</h3>

<textarea
id="announcement"
placeholder="متن اطلاعیه را بنویسید...">
</textarea>

<button class="green" onclick="saveAnnouncement()">
ثبت اطلاعیه
</button>

`;

}


function saveAnnouncement(){

let text=
document.getElementById("announcement").value.trim();

if(!text){

alert("لطفاً متن اطلاعیه را وارد کنید.");

return;
}

announcements.push(text);

notifications.push({

type:"اطلاعیه جدید",

text:text

});

saveData();

alert("اطلاعیه با موفقیت ثبت شد ✅");

showNotice();

}


/* =========================
درخواست
========================= */

function requestBox(){

document.getElementById("inside").innerHTML=`

<h3>📩 ثبت درخواست</h3>

<textarea
id="req"
placeholder="درخواست خود را بنویسید...">
</textarea>

<button class="green" onclick="saveRequest()">
ثبت درخواست
</button>

`;

}


function saveRequest(){

let text=
document.getElementById("req").value.trim();

if(!text){

alert("لطفاً درخواست را بنویسید.");

return;
}

requests.push(text);

saveData();

alert("درخواست شما با موفقیت ثبت شد ✅");

document.getElementById("inside").innerHTML="";

}


/* =========================
مشاهده درخواست‌ها
========================= */

function showRequests(){

let box=document.getElementById("inside");

if(requests.length===0){

box.innerHTML=`

<div class="notice">

هنوز درخواستی ثبت نشده است.

</div>

`;

return;
}

let html="<h3>📩 درخواست‌های والدین</h3>";

for(let i=0;i<requests.length;i++){

html+=`

<div class="notice">

<b>درخواست ${i+1}</b>

<br><br>

${requests[i]}

</div>

`;
}

box.innerHTML=html;

}


/* =========================
داشبورد
========================= */

function showDashboard(){

document.getElementById("inside").innerHTML=`

<h3>📊 داشبورد مدیریت مدرسه</h3>

<p style="color:#607d8b">
نمای کلی وضعیت سامانه
</p>

<div class="dashboard">

<div class="stat">
<div class="icon">👨‍🎓</div>
<div class="number">${students.length}</div>
<div class="title">دانش‌آموز</div>
</div>

<div class="stat">
<div class="icon">📢</div>
<div class="number">${announcements.length}</div>
<div class="title">اطلاعیه</div>
</div>

<div class="stat">
<div class="icon">📩</div>
<div class="number">${requests.length}</div>
<div class="title">درخواست</div>
</div>

<div class="stat">
<div class="icon">💬</div>
<div class="number">${familyMessages.length}</div>
<div class="title">پیام معلمان</div>
</div>

</div>

<div class="status">
🟢 سامانه فعال است
</div>

<div class="notice">

<b>📌 وضعیت ارتباطات</b>

<br><br>

والدین: فعال ✅
<br>

معلمان: فعال ✅
<br>

مدیریت: فعال ✅

</div>

<div class="notice">

<b>📚 وضعیت آموزشی</b>

<br><br>

${students.length}
دانش‌آموز در سامانه ثبت شده‌اند.

<br>

اطلاعات آموزشی دانش‌آموزان در دسترس است.

</div>

`;

}


/* =========================
خروج
========================= */

function backHome(){

document.getElementById("panel").style.display="none";

document.getElementById("home").style.display="block";

}

</script>

</body>
   </html>
