*{box-sizing:border-box}
body{

header{

.demo{color:#111;font-size:12px;margin-top:7px}

.container{max-width:1100px;margin:20px auto;padding:10px}
.card{

.roles{display:flex;gap:7px;margin-bottom:15px}
.roles button{

.roles button.active{background:#d978a0;color:#fff}
label{display:block;margin:10px 0 5px}

textarea{min-height:90px}
.btn{
 background:#d978a0;color:white;border:0;
 border-radius:10px;padding:10px 15px;
 cursor:pointer;margin:4px;
}
.btn.light{background:#f2dce5;color:#71364f}
.btn.red{background:#c95d73}
.nav{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:15px}
.nav button{
 border:0;border-radius:10px;padding:10px 13px;
 background:#f2dce5;color:#63344a;cursor:pointer;
}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
 gap:12px;
}
.stat{
 background:#fff0f6;
 border-radius:15px;
 padding:17px;
 text-align:center;
}
.stat b{display:block;font-size:25px;color:#9b4167}
.student{

 justify-content:space-between;
 align-items:center;
 gap:10px;
 padding:13px 4px;
 border-bottom:1px solid #f0e0e7;
}
.badge{
 display:inline-block;
 background:#f2d1df;
 color:#71384f;
 padding:4px 8px;
 border-radius:15px;
 font-size:11px;
 margin:2px;
}
.notice,.message{

 padding:12px;
 border-radius:11px;
 margin:8px 0;
}
.success{
 background:#e7f7ee;
 color:#246445;
 padding:10px;
 border-radius:10px;
 margin-top:10px;
}
.error{
 background:#ffe8ee;
 color:#a52f50;
 padding:10px;
 border-radius:10px;
 margin-top:10px;
}
.small{font-size:12px;color:#777}
.checks{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
 gap:7px;
 margin-top:10px;
}
.check{
 background:#fff5f8;
 padding:9px;
 border-radius:9px;
}
.hidden{display:none!important}
</style>
</head>

function normalize(v){
 return String(v||"")
 .replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d))
 .replace(/\s/g,"")
 .trim();
}

========================= */

function changeRole(r){
 role=r;

 document.getElementById("parentBtn").classList.toggle("active",r==="parent");
 document.getElementById("teacherBtn").classList.toggle("active",r==="teacher");
 document.getElementById("adminBtn").classList.toggle("active",r==="admin");

 document.getElementById("loginMessage").innerHTML="";
}

function login(){

 const u=normalize(document.getElementById("username").value);
 const p=normalize(document.getElementById("password").value);

 let found=null;

 if(role==="admin"){
   if(u===admin.u && p===admin.p) found=admin;
 }

 if(role==="teacher"){
   found=teachers.find(t=>
     t.u.toLowerCase()===u.toLowerCase() &&
     normalize(t.p)===p
   );
 }

 if(role==="parent"){
   found=students.find(s=>
     normalize(s.code)===u &&
     normalize(s.code)===p
   );
 }

 if(!found){
   document.getElementById("loginMessage").innerHTML=
   '<div class="error">نام کاربری یا رمز عبور اشتباه است.</div>';
   return;
 }

 currentUser=found;

 document.getElementById("loginPage").classList.add("hidden");
 document.getElementById("mainPage").classList.remove("hidden");

 document.getElementById("welcome").textContent=
 "سلام، "+found.name;

 document.getElementById("roleInfo").textContent=
 role==="admin"?"دسترسی کامل مدیر":
 role==="teacher"?"پنل اختصاصی معلم":
 "پنل اختصاصی والد";

 render();
}

function logout(){

 currentUser=null;

 document.getElementById("mainPage").classList.add("hidden");
 document.getElementById("loginPage").classList.remove("hidden");

 document.getElementById("username").value="";
 document.getElementById("password").value="";

 changeRole("parent");
}

 </div>`;

function getStudent(code){
 return students.find(s=>s.code===code);
}

function getTeacher(username){
 return teachers.find(t=>t.u===username);
}


/*
 هر دانش آموز می تواند چند معلم داشته باشد.
 assignments:
 {
   "کددانش‌آموز":["mandoosti","tavakoli","..."]
 }
*/

function getAssignedStudents(username){

 const explicitlyAssigned=students.filter(s=>
   data.assignments[s.code] &&
   data.assignments[s.code].includes(username)
 );

 /*
 اگر مدیر هنوز برای هیچ دانش‌آموزی اختصاص نداده باشد،
 معلم بر اساس پایه‌های خودش دانش‌آموزان را می‌بیند.
 به محض اینکه برای یک دانش‌آموز اختصاص صریح ثبت شود،
 همان اختصاص ملاک است.
 */

 const hasAnyAssignment=Object.keys(data.assignments).some(code=>
   Array.isArray(data.assignments[code]) &&
   data.assignments[code].length>0
 );

 if(!hasAnyAssignment){
   const t=getTeacher(username);
   return students.filter(s=>t && t.grades.includes(s.grade));
 }

 return explicitlyAssigned;
}

function drawStudents(){

 document.getElementById("studentSearch")?.value||""
 ).toLowerCase();

 s.name.toLowerCase().includes(q) ||
 s.code.includes(q)
 );

 document.getElementById("studentsList").innerHTML=
 arr.map(s=>{

   const assigned=data.assignments[s.code]||[];

   return `
   <div class="student">

    <div>
     <b>${s.name}</b>
     <div class="small">پایه ${s.grade}</div>
    </div>

    <div>
      ${
       assigned.length
       ?
       assigned.map(u=>
        `<span class="badge">
        ${getTeacher(u)?.name||u}
        </span>`
       ).join("")
       :
       `<span class="small">معلم اختصاص داده نشده</span>`
      }

   </div>`;
 }).join("");
}

}

function drawAssignments(){

 const grade=Number(
 document.getElementById("gradeFilter")?.value||0
 );

 const q=normalize(
 document.getElementById("assignSearch")?.value||""
 ).toLowerCase();

 const arr=students.filter(s=>
 (!grade || s.grade===grade) &&
 s.name.toLowerCase().includes(q)
 );

 document.getElementById("assignmentList").innerHTML=
 arr.map(s=>{

   const assigned=data.assignments[s.code]||[];

   return `
   <div class="card">

    <b>${s.name}</b>
    <span class="badge">پایه ${s.grade}</span>

    <div class="checks">

    ${teachers.map(t=>`

      <label class="check">

      <input
       type="checkbox"
       ${assigned.includes(t.u)?"checked":""}
       onchange="setAssignment('${s.code}','${t.u}',this.checked)"
      >

      ${t.name}

      </label>

    `).join("")}

    </div>

    <div class="small">
    معلم‌های انتخاب‌شده:
    ${
      assigned.length
      ?assigned.map(u=>
       `<span class="badge">${getTeacher(u)?.name||u}</span>`
      ).join("")
      :"هنوز انتخاب نشده"
    }
    </div>

   </div>`;
 }).join("");
}

function setAssignment(code,teacher,on){

 if(!data.assignments[code])
   data.assignments[code]=[];

 if(on){

   if(!data.assignments[code].includes(teacher))
     data.assignments[code].push(teacher);

 }else{

   data.assignments[code]=
   data.assignments[code].filter(x=>x!==teacher);

 }

 save();
}

function teacherStudent(code){

 const allowed=getAssignedStudents(currentUser.u)
 .some(s=>s.code===code);

 if(!allowed)return;

 const s=getStudent(code);

 const teachersOfStudent=
 data.assignments[code]||[];

 nav([["بازگشت","teacherStudents()"]])+

 teachersOfStudent.length
 ?
 teachersOfStudent.map(u=>

 ).join("")

}
