<title>همراه خانواده</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:linear-gradient(135deg,#fff7fb,#f7fbff);
color:#333;
}
header{
background:linear-gradient(135deg,#f5bdd4,#fde5ef);
padding:25px 15px;
text-align:center;
box-shadow:0 3px 15px #ddd;
}
header h1{margin:0;color:#222;font-size:30px}
header p{margin:8px 0;color:#333}
.school{font-weight:bold;color:#555}
.demo{
display:inline-block;
margin-top:8px;
background:#fff;
color:#222;
padding:6px 14px;
border-radius:20px;
font-size:12px;
}
.container{
max-width:1100px;
margin:25px auto;
padding:15px;
}
.card{
background:#fff;
border-radius:22px;
padding:22px;
margin-bottom:18px;
box-shadow:0 5px 20px #e8e8e8;
}
.center{text-align:center}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
}
button{
border:0;
border-radius:14px;
padding:12px 18px;
cursor:pointer;
font-family:inherit;
font-size:15px;
background:#efb1cd;
color:#222;
font-weight:bold;
margin:4px;
}
button:hover{filter:brightness(.96)}
input,select,textarea{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:12px;
font-family:inherit;
margin:6px 0 12px;
background:#fff;
}
textarea{min-height:110px;resize:vertical}
.hidden{display:none!important}
.nav{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-bottom:15px;
}
.nav button{
background:#f7d8e6;
font-size:13px;
}
.item{
padding:15px;
border:1px solid #eee;
border-radius:15px;
margin:9px 0;
background:#fff;
}
.badge{
display:inline-block;
padding:5px 10px;
border-radius:20px;
background:#e7f2ff;
font-size:12px;
margin:3px;
}
.success{background:#dff5e7}
.pink{background:#ffe0ed}
.back{background:#eee}
.danger{background:#ffd7d7}
.small{font-size:12px;color:#777}
.error{color:#d33}
</style>
</head>

<header>
<h1>🌱 همراه خانواده</h1>
<p>سامانه هوشمند ارتباط مدرسه و خانواده</p>
<div class="school">دبستان دخترانه امام حسین (ع) ، سرخس</div>
<div class="demo">نسخه نمایشی</div>
</header>

<div class="container">

<!-- صفحه اصلی -->
<section id="home" class="card">
<h2 class="center">ورود به سامانه</h2>

<div class="grid">
<button onclick="showLogin('parent')">👨‍👩‍👧 ورود والدین</button>
<button onclick="showLogin('teacher')">👩‍🏫 ورود معلمان</button>
<button onclick="showLogin('admin')">👩‍💼 ورود مدیر</button>
</div>
</section>

<!-- ورود -->
<section id="login" class="card hidden">

<h2 id="loginTitle"></h2>

<label>نام کاربری</label>
<input id="username" autocomplete="off">

<label>رمز عبور</label>
<input id="password" type="password" autocomplete="off">

<button onclick="login()">ورود</button>
<button class="back" onclick="goHome()">بازگشت</button>

<p id="loginError" class="error"></p>

<!-- پنل -->
<section id="panel" class="hidden">

<div class="card">
<h2 id="panelTitle"></h2>
<div id="nav" class="nav"></div>
<button class="back" onclick="logout()">خروج</button>
</div>

<div id="content"></div>

</section>

</div>

function normalizeNumber(value){
return String(value || "")
.replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d))
.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d))
.trim();
}

===================================================== */

function showLogin(r){

role=r;

document.getElementById("home").classList.add("hidden");
document.getElementById("login").classList.remove("hidden");

document.getElementById("username").value="";
document.getElementById("password").value="";
document.getElementById("loginError").textContent="";

document.getElementById("loginTitle").textContent=
r==="parent"?"👨‍👩‍👧 ورود والدین":
r==="teacher"?"👩‍🏫 ورود معلم":
"👩‍💼 ورود مدیر";
}


function goHome(){

document.getElementById("login").classList.add("hidden");
document.getElementById("home").classList.remove("hidden");

}


function login(){

const u=normalizeNumber(
document.getElementById("username").value
);

const p=normalizeNumber(
document.getElementById("password").value
);


/* مدیر */

if(role==="admin"){

if(u===admin.u && p===admin.p){

currentUser=admin;
openPanel();
return;

}

}


/* معلم */

if(role==="teacher"){

const teacher=teachers.find(t=>
t.u.toLowerCase()===u.toLowerCase() &&
normalizeNumber(t.p)===p
);

if(teacher){

currentUser=teacher;
openPanel();
return;

}

}


/* والد */

if(role==="parent"){

const student=studentsData.find(s=>
normalizeNumber(s.code)===u &&
normalizeNumber(s.code)===p
);

if(student){

currentUser=student;
openPanel();
return;

}

}


document.getElementById("loginError").textContent=
"نام کاربری یا رمز عبور صحیح نیست.";

}

document.getElementById("content").innerHTML=`

<div class="card">

function sendRequest(){

const text=
document.getElementById("requestText").value.trim();

if(!text){

alert("متن درخواست را وارد کنید.");
return;

}

requests.push({

id:Date.now(),

student:currentUser.name,

studentId:currentUser.id,

text:text,

status:"در انتظار بررسی"

});

save();

alert("درخواست شما ثبت شد 🌷");

parentRequest();

}

function sendTeacherMessage(){

const studentId=
Number(document.getElementById("msgStudent").value);

const text=
document.getElementById("msgText").value.trim();

if(!text){

alert("متن پیام را وارد کنید.");
return;

}

messages.push({

studentId:studentId,

teacher:currentUser.name,

text:text,

date:new Date().toLocaleDateString("fa-IR")

});

save();

alert("پیام ارسال شد ✅");

teacherMessage();
