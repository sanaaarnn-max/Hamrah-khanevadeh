```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>همراه خانواده</title>

<style>
body{
margin:0;
font-family:Tahoma,Arial;
background:linear-gradient(135deg,#e8f5e9,#e3f2fd);
color:#263238;
}

.container{
max-width:520px;
margin:auto;
padding:30px 18px;
text-align:center;
}

h1{
color:#1565c0;
font-size:32px;
}

.subtitle{
color:#546e7a;
margin-bottom:25px;
}

.card,.panel{
background:white;
padding:22px;
margin:15px 0;
border-radius:20px;
box-shadow:0 5px 18px #0002;
}

button{
width:100%;
padding:14px;
margin-top:10px;
border:0;
border-radius:12px;
background:#1976d2;
color:white;
font-size:16px;
}

.green{background:#43a047}
.gray{background:#78909c}

textarea,select{
width:90%;
padding:12px;
margin:8px;
border:1px solid #ddd;
border-radius:10px;
font-family:Tahoma;
box-sizing:border-box;
}

textarea{
height:90px;
}

select{
height:45px;
background:white;
}

.notice{
background:#f1f8e9;
padding:14px;
border-radius:12px;
margin-top:10px;
text-align:right;
}

.student{
background:#e3f2fd;
padding:14px;
border-radius:12px;
margin-top:10px;
text-align:right;
}

.message{
background:#fff8e1;
padding:14px;
border-radius:12px;
margin-top:10px;
text-align:right;
}

.infoBox{
background:#f5f7fa;
padding:15px;
border-radius:14px;
margin-top:10px;
text-align:right;
line-height:2;
}

.label{
font-weight:bold;
color:#1565c0;
}

.dashboard{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:15px;
}

.stat{
background:#f5f7fa;
padding:18px 10px;
border-radius:16px;
box-shadow:0 3px 10px #0001;
}

.stat .icon{
font-size:28px;
}

.stat .number{
font-size:26px;
font-weight:bold;
color:#1565c0;
margin:8px 0;
}

.stat .title{
font-size:14px;
color:#546e7a;
}

.status{
background:#e8f5e9;
padding:15px;
border-radius:14px;
margin-top:15px;
font-weight:bold;
color:#2e7d32;
}
</style>
</head>

<body>

<div class="container">

<h1>🌱 همراه خانواده</h1>
<div class="subtitle">سامانه هوشمند ارتباط مدرسه و خانواده</div>

<div id="home">

<div class="card">
<h2>👨‍👩‍👧 والدین</h2>
<p>ارتباط با مدرسه و پیگیری امور دانش‌آموز</p>
<button onclick="login('parent')">ورود والدین</button>
</div>

<div class="card">
<h2>👩‍🏫 معلمان</h2>
<p>مدیریت ارتباط با خانواده‌ها</p>
<button onclick="login('teacher')">ورود معلمان</button>
</div>

<div class="card">
<h2>👩‍💼 مدیریت مدرسه</h2>
<p>مدیریت ارتباطات و درخواست‌ها</p>
<button onclick="login('admin')">ورود مدیریت</button>
</div>

</div>

<div id="panel" class="panel" style="display:none"></div>

</div>

<script>

let requests=[];

let announcements=[
"جلسه اولیا و مربیان به‌زودی برگزار می‌شود."
];

let students=[
{
name:"آرین محمدی",
className:"سوم الف",
status:"فعال",
grade:"عالی",
attendance:"حاضر",
math:"عالی",
reading:"خوب",
behavior:"بسیار خوب"
},
{
name:"سارا احمدی",
className:"سوم الف",
status:"فعال",
grade:"خوب",
attendance:"حاضر",
math:"خوب",
reading:"عالی",
behavior:"خوب"
},
{
name:"پارسا رضایی",
className:"سوم الف",
status:"فعال",
grade:"نیازمند توجه",
attendance:"حاضر",
math:"متوسط",
reading:"خوب",
behavior:"خوب"
}
];

let familyMessages=[];


/* ورود */

function login(type){

let name=prompt("نام کاربری را وارد کنید:");
if(!name)return;

let panel=document.getElementById("panel");

if(type==="parent"){

panel.innerHTML=`
<h2>👨‍👩‍👧 پنل والدین</h2>
<p>خوش آمدید ${name} 🌷</p>

<button onclick="showNotice()">📢 اطلاعیه‌های مدرسه</button>
<button onclick="showStudent()">📚 اطلاعات آموزشی دانش‌آموز</button>
<button onclick="showParentMessages()">💬 پیام‌های معلم</button>
<button onclick="requestBox()">📩 درخواست به مدرسه</button>
<button class="gray" onclick="backHome()">بازگشت</button>

<div id="inside"></div>
`;
}

if(type==="teacher"){

panel.innerHTML=`
<h2>👩‍🏫 پنل معلمان</h2>
<p>خوش آمدید ${name} 🌷</p>

<button onclick="showNotice()">📢 اطلاعیه‌ها</button>
<button onclick="showStudents()">📚 دانش‌آموزان</button>
<button onclick="showFamilyMessages()">👨‍👩‍👧 ارتباط با خانواده</button>
<button class="gray" onclick="backHome()">بازگشت</button>

<div id="inside"></div>
`;
}

if(type==="admin"){

panel.innerHTML=`
<h2>👩‍💼 پنل مدیریت</h2>
<p>خوش آمدید ${name} 🌷</p>

<button onclick="showNotice()">📢 اطلاعیه‌های مدرسه</button>
<button onclick="showRequests()">📩 مشاهده درخواست‌های والدین</button>
<button onclick="showDashboard()">📊 داشبورد مدیریت</button>
<button onclick="addAnnouncement()">📝 ثبت اطلاعیه جدید</button>
<button class="gray" onclick="backHome()">بازگشت</button>

<div id="inside"></div>
`;
}

document.getElementById("home").style.display="none";
panel.style.display="block";

}


/* اطلاعیه */

function showNotice(){

let html="<h3>📢 اطلاعیه‌های مدرسه</h3>";

for(let i=0;i<announcements.length;i++){

html+=`
<div class="notice">
<b>اطلاعیه ${i+1}</b><br><br>
${announcements[i]}
</div>
`;

}

document.getElementById("inside").innerHTML=html;

}


/* اطلاعات دانش‌آموز */

function showStudent(){

let s=students[0];

document.getElementById("inside").innerHTML=`

<h3>📚 پرونده آموزشی دانش‌آموز</h3>

<div class="infoBox">

<div>
<span class="label">👤 نام دانش‌آموز:</span>
${s.name}
</div>

<div>
<span class="label">🏫 کلاس:</span>
${s.className}
</div>

<div>
<span class="label">✅ وضعیت:</span>
${s.status}
</div>

<div>
<span class="label">📊 ارزیابی کلی:</span>
${s.grade}
</div>

<div>
<span class="label">🕐 وضعیت حضور:</span>
${s.attendance}
</div>

</div>

<h3>📖 ارزیابی درسی</h3>

<div class="notice">
➗ ریاضی: <b>${s.math}</b><br><br>
📚 خواندن و فارسی: <b>${s.reading}</b><br><br>
🌱 رفتار و مشارکت: <b>${s.behavior}</b>
</div>

`;

}


/* دانش‌آموزان معلم */

function showStudents(){

let html=`
<h3>📚 فهرست دانش‌آموزان</h3>
<p>کلاس سوم الف</p>
`;

for(let i=0;i<students.length;i++){

html+=`
<div class="student">

<b>${students[i].name}</b><br>
کلاس: ${students[i].className}<br>
وضعیت: ${students[i].status}<br>
ارزیابی: ${students[i].grade}

<button onclick="studentInfo(${i})">
مشاهده پرونده
</button>

</div>
`;

}

document.getElementById("inside").innerHTML=html;

}


/* پرونده دانش‌آموز */

function studentInfo(index){

let s=students[index];

document.getElementById("inside").innerHTML=`

<h3>📋 پرونده دانش‌آموز</h3>

<div class="infoBox">

<b>👤 نام:</b> ${s.name}<br>
<b>🏫 کلاس:</b> ${s.className}<br>
<b>✅ وضعیت:</b> ${s.status}<br>
<b>📊 ارزیابی کلی:</b> ${s.grade}<br>
<b>🕐 حضور:</b> ${s.attendance}<br>

</div>

<div class="notice">

➗ ریاضی: ${s.math}<br><br>
📚 خواندن و فارسی: ${s.reading}<br><br>
🌱 رفتار و مشارکت: ${s.behavior}

</div>

<button onclick="showStudents()">
بازگشت به فهرست
</button>

`;

}


/* ارتباط خانواده */

function showFamilyMessages(){

let html=`

<h3>👨‍👩‍👧 ارتباط با خانواده</h3>

<select id="familyStudent">

<option value="">انتخاب دانش‌آموز</option>
`;

for(let i=0;i<students.length;i++){

html+=`
<option value="${i}">
${students[i].name} - ${students[i].className}
</option>
`;

}

html+=`

</select>

<textarea id="familyMessage"
placeholder="پیام خود را برای خانواده بنویسید..."></textarea>

<button class="green" onclick="sendFamilyMessage()">
ارسال پیام
</button>

`;

if(familyMessages.length>0){

html+=`<h3>📨 پیام‌های ثبت‌شده</h3>`;

for(let i=0;i<familyMessages.length;i++){

html+=`
<div class="message">

<b>${familyMessages[i].student}</b><br><br>

${familyMessages[i].text}

</div>
`;

}

}

document.getElementById("inside").innerHTML=html;

}


/* ارسال پیام */

function sendFamilyMessage(){

let studentIndex=document.getElementById("familyStudent").value;
let message=document.getElementById("familyMessage").value.trim();

if(studentIndex===""){

alert("لطفاً دانش‌آموز را انتخاب کنید.");
return;

}

if(!message){

alert("لطفاً متن پیام را وارد کنید.");
return;

}

familyMessages.push({
student:students[studentIndex].name,
text:message
});

alert("پیام با موفقیت ثبت شد ✅");

showFamilyMessages();

}


/* پیام‌های والدین */

function showParentMessages(){

if(familyMessages.length===0){

document.getElementById("inside").innerHTML=`

<div class="notice">
📭 هنوز پیامی از طرف معلم ثبت نشده است.
</div>

`;

return;

}

let html="<h3>💬 پیام‌های معلم</h3>";

for(let i=0;i<familyMessages.length;i++){

html+=`

<div class="message">

<b>👩‍🏫 پیام برای ${familyMessages[i].student}</b>

<br><br>

${familyMessages[i].text}

</div>

`;

}

document.getElementById("inside").innerHTML=html;

}


/* اطلاعیه جدید */

function addAnnouncement(){

document.getElementById("inside").innerHTML=`

<h3>📝 ثبت اطلاعیه جدید</h3>

<textarea id="announcement"
placeholder="متن اطلاعیه را بنویسید..."></textarea>

<button class="green" onclick="saveAnnouncement()">
ثبت اطلاعیه
</button>
`;

}


function saveAnnouncement(){

let text=document.getElementById("announcement").value.trim();

if(!text){

alert("لطفاً متن اطلاعیه را وارد کنید.");
return;

}

announcements.push(text);

alert("اطلاعیه با موفقیت ثبت شد ✅");

showNotice();

}


/* درخواست والدین */

function requestBox(){

document.getElementById("inside").innerHTML=`

<h3>📩 ثبت درخواست</h3>

<textarea id="req"
placeholder="درخواست خود را بنویسید..."></textarea>

<button class="green" onclick="saveRequest()">
ثبت درخواست
</button>
`;

}


function saveRequest(){

let text=document.getElementById("req").value.trim();

if(!text){

alert("لطفاً درخواست را بنویسید.");
return;

}

requests.push(text);

alert("درخواست شما با موفقیت ثبت شد ✅");

document.getElementById("inside").innerHTML="";

}


/* درخواست‌ها */

function showRequests(){

let box=document.getElementById("inside");

if(requests.length===0){

box.innerHTML=`

<div class="notice">
هنوز درخواستی ثبت نشده است.
</div>

`;

return;

}

let html="<h3>📩 درخواست‌های والدین</h3>";

for(let i=0;i<requests.length;i++){

html+=`

<div class="notice">

<b>درخواست ${i+1}</b><br><br>

${requests[i]}

</div>

`;

}

box.innerHTML=html;

}


/* داشبورد حرفه‌ای مدیریت */

function showDashboard(){

document.getElementById("inside").innerHTML=`

<h3>📊 داشبورد مدیریت مدرسه</h3>

<p style="color:#546e7a">
نمای کلی وضعیت سامانه
</p>

<div class="dashboard">

<div class="stat">
<div class="icon">👨‍🎓</div>
<div class="number">${students.length}</div>
<div class="title">دانش‌آموز</div>
</div>

<div class="stat">
<div class="icon">📢</div>
<div class="number">${announcements.length}</div>
<div class="title">اطلاعیه</div>
</div>

<div class="stat">
<div class="icon">📩</div>
<div class="number">${requests.length}</div>
<div class="title">درخواست</div>
</div>

<div class="stat">
<div class="icon">💬</div>
<div class="number">${familyMessages.length}</div>
<div class="title">پیام معلمان</div>
</div>

</div>

<div class="status">
🟢 سامانه فعال است
</div>

<div class="notice">

<b>📌 وضعیت ارتباطات</b><br><br>

والدین: فعال ✅<br>
معلمان: فعال ✅<br>
مدیریت: فعال ✅

</div>

<div class="notice">

<b>📚 وضعیت آموزشی</b><br><br>

${students.length} دانش‌آموز در سامانه ثبت شده‌اند.<br>
اطلاعات آموزشی دانش‌آموزان در دسترس است.

</div>

`;

}


/* بازگشت */

function backHome(){

document.getElementById("panel").style.display="none";
document.getElementById("home").style.display="block";

}

</script>

</body>
</html>
```
