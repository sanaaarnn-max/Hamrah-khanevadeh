*{box-sizing:border-box}

textarea{

.hidden{

.nav{

.nav button{

.item{

  margin:9px 0;
  background:#fff;

.badge{

  background:#e7f2ff;
  font-size:12px;
  margin:3px;

.success{background:#dff5e7}
.pink{background:#ffe0ed}
.back{background:#eee}
.danger{background:#ffd7d7}
.small{font-size:12px;color:#777}
.error{color:#d33}

.stat{
  text-align:center;
  padding:20px;
  border-radius:18px;
  background:#fff0f6;
}

.stat strong{
  display:block;
  font-size:28px;
  margin-top:8px;
}

.student-card{
  border:1px solid #f1d7e3;
  border-radius:18px;
  padding:16px;
  margin:10px 0;
  background:#fffafd;
}

.student-card h3{
  margin-top:0;
}

hr{
  border:0;
  border-top:1px solid #eee;
  margin:18px 0;
}
</style>
</head>

</div>

/* =====================================================
   اطلاعات ورود فعلی
===================================================== */

let currentUser = null;
let currentRole = null;


/* =====================================================
   اطلاعات ذخیره‌شده
===================================================== */

let announcements =
  JSON.parse(localStorage.getItem("hamrah_announcements") || "[]");

let requests =
  JSON.parse(localStorage.getItem("hamrah_requests") || "[]");

let messages =
  JSON.parse(localStorage.getItem("hamrah_messages") || "[]");

let calendar =
  JSON.parse(localStorage.getItem("hamrah_calendar") || "[]");


/* =====================================================
   توابع عمومی
===================================================== */

function saveData(){
  localStorage.setItem(
    "hamrah_announcements",
    JSON.stringify(announcements)
  );

  localStorage.setItem(
    "hamrah_requests",
    JSON.stringify(requests)
  );

  localStorage.setItem(
    "hamrah_messages",
    JSON.stringify(messages)
  );

  localStorage.setItem(
    "hamrah_calendar",
    JSON.stringify(calendar)
  );
}


function gradeName(grade){
  return "پایه " + ["","اول","دوم","سوم","چهارم","پنجم","ششم"][grade];
}


function fullName(student){
  return student[1] + " " + student[2];
}


/* =====================================================
   نمایش ورود
===================================================== */

function showLogin(role){

  document.getElementById("home").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");

  document.getElementById("username").value = "";
  document.getElementById("password").value = "";
  document.getElementById("loginError").textContent = "";

  currentRole = role;

  if(role === "parent"){
    document.getElementById("loginTitle").textContent =
      "👨‍👩‍👧 ورود والدین";
  }

  if(role === "teacher"){
    document.getElementById("loginTitle").textContent =
      "👩‍🏫 ورود معلم";
  }

  if(role === "admin"){
    document.getElementById("loginTitle").textContent =
      "👩‍💼 ورود مدیر";
  }
}


function goHome(){

  document.getElementById("login").classList.add("hidden");
  document.getElementById("panel").classList.add("hidden");
  document.getElementById("home").classList.remove("hidden");

  currentUser = null;
  currentRole = null;
}


/* =====================================================
   ورود به سامانه
===================================================== */

function login(){

  const username =
    normalizeNumber(document.getElementById("username").value);

  const password =
    normalizeNumber(document.getElementById("password").value);

  const error =
    document.getElementById("loginError");

  error.textContent = "";


  /* ---------- والد ---------- */

  if(currentRole === "parent"){

    const student = students.find(
      s =>
        normalizeNumber(s[0]) === username &&
        normalizeNumber(s[0]) === password
    );

    if(!student){
      error.textContent =
        "نام کاربری یا رمز عبور اشتباه است.";
      return;
    }

    currentUser = {
      type:"parent",
      student:student
    };

    openParentPanel();
    return;
  }


  /* ---------- معلم ---------- */

  if(currentRole === "teacher"){

    const teacher = teachers.find(
      t =>
        t.username === username &&
        normalizeNumber(t.password) === password
    );

    if(!teacher){
      error.textContent =
        "نام کاربری یا رمز عبور معلم اشتباه است.";
      return;
    }

    currentUser = {
      type:"teacher",
      teacher:teacher
    };

    openTeacherPanel();
    return;
  }


  /* ---------- مدیر ---------- */

  if(currentRole === "admin"){

    if(username === "admin" && password === "1234"){

      currentUser = {
        type:"admin",
        name:"مدیر مدرسه"
      };

      openAdminPanel();
      return;
    }

    error.textContent =
      "نام کاربری یا رمز عبور مدیر اشتباه است.";

    return;
  }
}


/* =====================================================
   ساخت پنل اصلی
===================================================== */

function openPanel(title, buttons){

  document.getElementById("login").classList.add("hidden");
  document.getElementById("home").classList.add("hidden");
  document.getElementById("panel").classList.remove("hidden");

  document.getElementById("panelTitle").textContent = title;

  const nav = document.getElementById("nav");

  nav.innerHTML = "";

  buttons.forEach(btn => {

    const button = document.createElement("button");

    button.textContent = btn.text;

    button.onclick = btn.action;

    nav.appendChild(button);

  });

  document.getElementById("content").innerHTML = "";
}


/* =====================================================
   پنل والد
===================================================== */

function openParentPanel(){

  const student = currentUser.student;

  openPanel(
    "👨‍👩‍👧 پنل خانواده - " + fullName(student),
    [
      {
        text:"🏠 وضعیت تحصیلی",
        action:showParentDashboard
      },
      {
        text:"💬 پیام‌های مدرسه",
        action:showParentMessages
      },
      {
        text:"📩 درخواست به مدرسه",
        action:showParentRequest
      },
      {
        text:"📢 اطلاعیه‌های مدرسه",
        action:showParentAnnouncements
      },
      {
        text:"📅 تقویم مدرسه",
        action:showParentCalendar
      }
    ]
  );

  showParentDashboard();
}

function filterAdminStudents(){

  const value =
    document.getElementById("studentSearch").value
      .trim()
      .toLowerCase();

  document
    .querySelectorAll(".admin-student")
    .forEach(card => {

      const name =
        card.dataset.name.toLowerCase();

      card.style.display =
        name.includes(value) ? "block" : "none";

    });
}

  document.getElementById("announcementTitle").value = "";

  renderAdminAnnouncements();
