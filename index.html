<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>همراه خانواده</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:linear-gradient(135deg,#e3f2fd,#f1f8e9);
color:#263238;
min-height:100vh;
}

.container{
max-width:520px;
margin:auto;
padding:20px 16px 40px;
}

.header{
background:linear-gradient(135deg,#1565c0,#1976d2);
color:white;
padding:27px 20px;
border-radius:25px;
box-shadow:0 8px 25px #0002;
margin-bottom:20px;
text-align:center;
}

.header h1{
margin:0;
font-size:30px;
}

.header p{
margin:10px 0 0;
font-size:14px;
}

.card,.panel{
background:white;
padding:20px;
margin:14px 0;
border-radius:20px;
box-shadow:0 5px 20px #0001;
}

.card{text-align:center}

.role-icon{
font-size:38px;
}

.card h2{
margin:8px 0;
}

.card p{
color:#607d8b;
font-size:14px;
line-height:1.8;
}

button{
width:100%;
padding:14px;
margin-top:10px;
border:0;
border-radius:13px;
background:#1976d2;
color:white;
font-size:16px;
font-family:Tahoma;
cursor:pointer;
}

.green{background:#43a047}
.gray{background:#78909c}
.red{background:#e53935}

input,textarea,select{
width:100%;
padding:13px;
margin:7px 0;
border:1px solid #dce3e8;
border-radius:12px;
font-family:Tahoma;
font-size:14px;
background:white;
}

textarea{
height:95px;
resize:none;
}

select{
height:48px;
}

.loginBox{
background:#f7f9fb;
padding:15px;
border-radius:15px;
margin-top:15px;
}

.notice{
background:#f1f8e9;
padding:15px;
border-radius:13px;
margin-top:10px;
text-align:right;
line-height:1.9;
}

.student{
background:#e3f2fd;
padding:15px;
border-radius:14px;
margin-top:10px;
text-align:right;
line-height:1.9;
}

.message{
background:#fff8e1;
padding:15px;
border-radius:14px;
margin-top:10px;
text-align:right;
line-height:1.9;
}

.infoBox{
background:#f7f9fb;
padding:16px;
border-radius:14px;
margin-top:10px;
text-align:right;
line-height:2;
}

.label{
font-weight:bold;
color:#1565c0;
}

.childBox{
background:linear-gradient(135deg,#e3f2fd,#f1f8e9);
padding:17px;
border-radius:16px;
margin-top:12px;
text-align:right;
}

.dashboard{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:15px;
}

.stat{
background:#f7f9fb;
padding:18px 10px;
border-radius:17px;
text-align:center;
box-shadow:0 3px 12px #0001;
}

.stat .icon{
font-size:28px;
}

.stat .number{
font-size:27px;
font-weight:bold;
color:#1565c0;
margin:7px 0;
}

.stat .title{
font-size:13px;
color:#607d8b;
}

.status{
background:#e8f5e9;
padding:15px;
border-radius:14px;
margin-top:15px;
font-weight:bold;
color:#2e7d32;
text-align:center;
}

.notification{
background:#fff3e0;
border-right:5px solid #fb8c00;
padding:15px;
border-radius:13px;
margin-top:10px;
text-align:right;
line-height:1.9;
}

.badge{
display:inline-block;
background:#e53935;
color:white;
border-radius:20px;
padding:3px 8px;
font-size:11px;
margin-right:5px;
}

.small{
font-size:12px;
color:#78909c;
line-height:1.8;
}

.footer{
text-align:center;
color:#78909c;
font-size:12px;
margin-top:25px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🌱 همراه خانواده</h1>
<p>سامانه هوشمند ارتباط مدرسه و خانواده</p>
</div>

<div id="home">

<div class="card">
<div class="role-icon">👨‍👩‍👧</div>
<h2>والدین</h2>
<p>پیگیری وضعیت آموزشی و ارتباط با مدرسه</p>
<button onclick="login('parent')">ورود والدین</button>
</div>

<div class="card">
<div class="role-icon">👩‍🏫</div>
<h2>معلمان</h2>
<p>مدیریت دانش‌آموزان و ارتباط با خانواده‌ها</p>
<button onclick="login('teacher')">ورود معلمان</button>
</div>

<div class="card">
<div class="role-icon">👩‍💼</div>
<h2>مدیریت مدرسه</h2>
<p>مدیریت اطلاعات، اطلاعیه‌ها و درخواست‌ها</p>
<button onclick="login('admin')">ورود مدیریت</button>
</div>

</div>

<div id="panel" class="panel" style="display:none"></div>

<div class="footer">
نسخه نمایشی سامانه «همراه خانواده»
</div>

</div>


<script>

/* =========================
حساب‌های نمایشی
========================= */

const accounts = {

admin:{
username:"admin",
password:"1234"
},

teacher:{
username:"teacher",
password:"5678"
},

parent:{
username:"parent",
password:"2468"
}

};


/* =========================
اطلاعات سامانه
========================= */

let requests =
JSON.parse(localStorage.getItem("school_requests")) || [];

let announcements =
JSON.parse(localStorage.getItem("school_announcements")) || [
"جلسه اولیا و مربیان به‌زودی برگزار می‌شود."
];

let students =
JSON.parse(localStorage.getItem("school_students")) || [

{
name:"آرین محمدی",
grade:"سوم",
className:"سوم الف",
teacher:"خانم احمدی",
status:"فعال",
evaluation:"عالی",
attendance:"حاضر",
math:"عالی",
reading:"خوب",
behavior:"بسیار خوب"
},

{
name:"سارا احمدی",
grade:"سوم",
className:"سوم الف",
teacher:"خانم احمدی",
status:"فعال",
evaluation:"خوب",
attendance:"حاضر",
math:"خوب",
reading:"عالی",
behavior:"خوب"
},

{
name:"پارسا رضایی",
grade:"سوم",
className:"سوم الف",
teacher:"خانم احمدی",
status:"فعال",
evaluation:"نیازمند توجه",
attendance:"حاضر",
math:"متوسط",
reading:"خوب",
behavior:"خوب"
}

];

let familyMessages =
JSON.parse(localStorage.getItem("school_messages")) || [];

let notifications =
JSON.parse(localStorage.getItem("school_notifications")) || [

{
type:"اطلاعیه",
text:"جلسه اولیا و مربیان به‌زودی برگزار می‌شود."
}

];


/* دانش‌آموز انتخاب‌شده توسط والد */

let selectedChildIndex = null;


/* =========================
ذخیره اطلاعات
========================= */

function saveData(){

localStorage.setItem(
"school_requests",
JSON.stringify(requests)
);

localStorage.setItem(
"school_announcements",
JSON.stringify(announcements)
);

localStorage.setItem(
"school_students",
JSON.stringify(students)
);

localStorage.setItem(
"school_messages",
JSON.stringify(familyMessages)
);

localStorage.setItem(
"school_notifications",
JSON.stringify(notifications)
);

}


/* =========================
ورود
========================= */

function login(type){

let roleName="";
let roleIcon="";

if(type==="parent"){
roleName="والدین";
roleIcon="👨‍👩‍👧";
}

if(type==="teacher"){
roleName="معلم";
roleIcon="👩‍🏫";
}

if(type==="admin"){
roleName="مدیریت مدرسه";
roleIcon="👩‍💼";
}

let panel=document.getElementById("panel");

panel.innerHTML=`

<div class="loginBox">

<h2>${roleIcon} ورود ${roleName}</h2>

<p class="small">
نام کاربری و رمز عبور خود را وارد کنید.
</p>

<input
id="loginUsername"
placeholder="نام کاربری"
>

<input
id="loginPassword"
type="password"
placeholder="رمز عبور"
>

<button onclick="checkLogin('${type}')">
ورود به سامانه
</button>

<button class="gray" onclick="backHome()">
بازگشت
</button>

</div>
`;

document.getElementById("home").style.display="none";
panel.style.display="block";

}


/* =========================
بررسی ورود
========================= */

function checkLogin(type){

let username=
document.getElementById("loginUsername").value.trim();

let password=
document.getElementById("loginPassword").value.trim();

if(
username===accounts[type].username &&
password===accounts[type].password
){

openPanel(type);

}else{

alert("نام کاربری یا رمز عبور اشتباه است ❌");

}

}


/* =========================
باز کردن پنل
========================= */

function openPanel(type){

let panel=document.getElementById("panel");


/* والدین */

if(type==="parent"){

panel.innerHTML=`

<h2>👨‍👩‍👧 پنل والدین</h2>

<p>
به سامانه همراه خانواده خوش آمدید 🌷
</p>

<div class="childBox">

<b>👦 انتخاب فرزند</b>

<select id="parentChildSelect"
onchange="selectParentChild()">

<option value="">
انتخاب دانش‌آموز
</option>

${students.map((s,i)=>`

<option value="${i}">
${s.name} - ${s.className}
</option>

`).join("")}

</select>

<div id="selectedChildInfo"></div>

</div>

<button onclick="showNotifications()">
🔔 اعلان‌ها ${notificationBadge()}
</button>

<button onclick="showNotice()">
📢 اطلاعیه‌های مدرسه
</button>

<button onclick="showSelectedStudent()">
📚 اطلاعات آموزشی فرزند
</button>

<button onclick="showParentMessages()">
💬 پیام‌های معلم ${messageBadge()}
</button>

<button onclick="requestBox()">
📩 درخواست به مدرسه
</button>

<button class="gray" onclick="backHome()">
🚪 خروج
</button>

<div id="inside"></div>
`;

}


/* معلم */

if(type==="teacher"){

panel.innerHTML=`

<h2>👩‍🏫 پنل معلم</h2>

<p>به سامانه خوش آمدید 🌷</p>

<button onclick="showNotifications()">
🔔 اعلان‌ها ${notificationBadge()}
</button>

<button onclick="showNotice()">
📢 اطلاعیه‌ها
</button>

<button onclick="showStudents()">
📚 دانش‌آموزان
</button>

<button onclick="showFamilyMessages()">
👨‍👩‍👧 ارتباط با خانواده
</button>

<button class="gray" onclick="backHome()">
🚪 خروج
</button>

<div id="inside"></div>
`;

}


/* مدیریت */

if(type==="admin"){

panel.innerHTML=`

<h2>👩‍💼 پنل مدیریت مدرسه</h2>

<p>به سامانه خوش آمدید 🌷</p>

<button onclick="showNotifications()">
🔔 اعلان‌ها ${notificationBadge()}
</button>

<button onclick="showNotice()">
📢 اطلاعیه‌های مدرسه
</button>

<button onclick="showRequests()">
📩 درخواست‌های والدین
</button>

<button onclick="showDashboard()">
📊 داشبورد مدیریت
</button>

<button onclick="addAnnouncement()">
📝 ثبت اطلاعیه جدید
</button>

<button onclick="addStudent()">
➕ افزودن دانش‌آموز
</button>

<button onclick="manageStudents()">
👨‍🎓 مدیریت دانش‌آموزان
</button>

<button class="gray" onclick="backHome()">
🚪 خروج
</button>

<div id="inside"></div>
`;

}

}


/* =========================
انتخاب فرزند
========================= */

function selectParentChild(){

let value=
document.getElementById("parentChildSelect").value;

if(value===""){

selectedChildIndex=null;

document.getElementById(
"selectedChildInfo"
).innerHTML="";

return;
}

selectedChildIndex=parseInt(value);

let s=students[selectedChildIndex];

document.getElementById(
"selectedChildInfo"
).innerHTML=`

<div class="infoBox">

<b>👤 ${s.name}</b>

<br>

🏫 پایه: ${s.grade}

<br>

📚 کلاس: ${s.className}

<br>

👩‍🏫 معلم: ${s.teacher}

</div>

`;

}


/* =========================
پرونده فرزند
========================= */

function showSelectedStudent(){

if(selectedChildIndex===null){

alert("لطفاً ابتدا فرزند را انتخاب کنید.");

return;
}

let s=students[selectedChildIndex];

document.getElementById("inside").innerHTML=`

<h3>📚 پرونده آموزشی فرزند</h3>

<div class="infoBox">

<div>
<span class="label">👤 نام:</span>
${s.name}
</div>

<div>
<span class="label">🏫 پایه:</span>
${s.grade}
</div>

<div>
<span class="label">📚 کلاس:</span>
${s.className}
</div>

<div>
<span class="label">👩‍🏫 معلم:</span>
${s.teacher}
</div>

<div>
<span class="label">📊 ارزیابی:</span>
${s.evaluation}
</div>

<div>
<span class="label">🕐 حضور:</span>
${s.attendance}
</div>

</div>

<h3>📖 وضعیت درسی</h3>

<div class="notice">

➗ ریاضی:
<b>${s.math}</b>

<br><br>

📚 خواندن و فارسی:
<b>${s.reading}</b>

<br><br>

🌱 رفتار و مشارکت:
<b>${s.behavior}</b>

</div>

`;

}


/* =========================
اعلان‌ها
========================= */

function notificationBadge(){

if(notifications.length===0)return "";

return `<span class="badge">${notifications.length}</span>`;
}


function messageBadge(){

if(familyMessages.length===0)return "";

return `<span class="badge">${familyMessages.length}</span>`;
}


function showNotifications(){

let html="<h3>🔔 اعلان‌های جدید</h3>";

if(notifications.length===0){

html+=`

<div class="notice">
📭 اعلان جدیدی وجود ندارد.
</div>

`;

}else{

for(let i=0;i<notifications.length;i++){

html+=`

<div class="notification">

<b>🔔 ${notifications[i].type}</b>

<br><br>

${notifications[i].text}

</div>

`;
}

html+=`

<button class="gray" onclick="clearNotifications()">
خواندم ✓
</button>
`;

}

document.getElementById("inside").innerHTML=html;

}


function clearNotifications(){

notifications=[];

saveData();

alert("اعلان‌ها خوانده شدند ✅");

showNotifications();

}


/* =========================
اطلاعیه‌ها
========================= */

function showNotice(){

let html="<h3>📢 اطلاعیه‌های مدرسه</h3>";

for(let i=0;i<announcements.length;i++){

html+=`

<div class="notice">

<b>اطلاعیه ${i+1}</b>

<br><br>

${announcements[i]}

</div>

`;
}

document.getElementById("inside").innerHTML=html;

}


/* =========================
فهرست دانش‌آموزان
========================= */

function showStudents(){

let html=`

<h3>📚 فهرست دانش‌آموزان</h3>

`;

for(let i=0;i<students.length;i++){

html+=`

<div class="student">

<b>👤 ${students[i].name}</b>

<br>

🏫 پایه: ${students[i].grade}

<br>

📚 کلاس: ${students[i].className}

<br>

👩‍🏫 معلم: ${students[i].teacher}

<br>

📊 ارزیابی: ${students[i].evaluation}

<button onclick="studentInfo(${i})">
مشاهده پرونده
</button>

</div>

`;

}

document.getElementById("inside").innerHTML=html;

}


/* =========================
پرونده دانش‌آموز
========================= */

function studentInfo(index){

let s=students[index];

document.getElementById("inside").innerHTML=`

<h3>📋 پرونده دانش‌آموز</h3>

<div class="infoBox">

<b>👤 نام:</b>
${s.name}

<br>

<b>🏫 پایه:</b>
${s.grade}

<br>

<b>📚 کلاس:</b>
${s.className}

<br>

<b>👩‍🏫 معلم:</b>
${s.teacher}

<br>

<b>📊 ارزیابی:</b>
${s.evaluation}

<br>

<b>🕐 حضور:</b>
${s.attendance}

</div>

<div class="notice">

➗ ریاضی: ${s.math}

<br><br>

📚 خواندن و فارسی: ${s.reading}

<br><br>

🌱 رفتار و مشارکت: ${s.behavior}

</div>

<button onclick="showStudents()">
بازگشت به فهرست
</button>

`;

}


/* =========================
افزودن دانش‌آموز
========================= */

function addStudent(){

document.getElementById("inside").innerHTML=`

<h3>➕ افزودن دانش‌آموز</h3>

<input
id="newName"
placeholder="نام و نام خانوادگی دانش‌آموز"
>

<select id="newGrade">

<option value="">
انتخاب پایه
</option>

<option>اول</option>
<option>دوم</option>
<option>سوم</option>
<option>چهارم</option>
<option>پنجم</option>
<option>ششم</option>

</select>

<input
id="newClass"
placeholder="مثلاً سوم الف"
>

<input
id="newTeacher"
placeholder="نام معلم"
>

<select id="newStatus">

<option>فعال</option>
<option>نیازمند توجه</option>

</select>

<select id="newEvaluation">

<option>عالی</option>
<option>خوب</option>
<option>متوسط</option>
<option>نیازمند توجه</option>

</select>

<button class="green" onclick="saveStudent()">
ثبت دانش‌آموز
</button>

<button class="gray" onclick="manageStudents()">
مدیریت دانش‌آموزان
</button>

`;

}


function saveStudent(){

let name=
document.getElementById("newName").value.trim();

let grade=
document.getElementById("newGrade").value;

let className=
document.getElementById("newClass").value.trim();

let teacher=
document.getElementById("newTeacher").value.trim();

let status=
document.getElementById("newStatus").value;

let evaluation=
document.getElementById("newEvaluation").value;

if(!name || !grade || !className || !teacher){

alert("لطفاً همه اطلاعات را وارد کنید.");

return;
}

students.push({

name:name,
grade:grade,
className:className,
teacher:teacher,
status:status,
evaluation:evaluation,
attendance:"حاضر",
math:"ثبت نشده",
reading:"ثبت نشده",
behavior:"ثبت نشده"

});

saveData();

alert("دانش‌آموز با موفقیت اضافه شد ✅");

manageStudents();

}


/* =========================
مدیریت دانش‌آموزان
========================= */

function manageStudents(){

let html=`

<h3>👨‍🎓 مدیریت دانش‌آموزان</h3>

<p class="small">
تعداد کل دانش‌آموزان: ${students.length}
</p>

`;

if(students.length===0){

html+=`

<div class="notice">
هنوز دانش‌آموزی ثبت نشده است.
</div>

`;

}else{

for(let i=0;i<students.length;i++){

html+=`

<div class="student">

<b>${students[i].name}</b>

<br>

پایه: ${students[i].grade}

<br>

کلاس: ${students[i].className}

<br>

معلم: ${students[i].teacher}

<button class="red" onclick="deleteStudent(${i})">
حذف دانش‌آموز
</button>

</div>

`;

}

}

html+=`

<button class="green" onclick="addStudent()">
➕ افزودن دانش‌آموز جدید
</button>

`;

document.getElementById("inside").innerHTML=html;

}


function deleteStudent(index){

let ok=confirm(
"آیا از حذف این دانش‌آموز مطمئن هستید؟"
);

if(!ok)return;

students.splice(index,1);

saveData();

manageStudents();

}


/* =========================
ارتباط معلم با خانواده
========================= */

function showFamilyMessages(){

let html=`

<h3>👨‍👩‍👧 ارتباط با خانواده</h3>

<select id="familyStudent">

<option value="">
انتخاب دانش‌آموز
</option>

`;

for(let i=0;i<students.length;i++){

html+=`

<option value="${i}">
${students[i].name} - ${students[i].className}
</option>

`;

}

html+=`

</select>

<textarea
id="familyMessage"
placeholder="پیام خود را برای خانواده بنویسید...">
</textarea>

<button class="green" onclick="sendFamilyMessage()">
ارسال پیام
</button>

`;

if(familyMessages.length>0){

html+=`<h3>📨 پیام‌های ثبت‌شده</h3>`;

for(let i=0;i<familyMessages.length;i++){

html+=`

<div class="message">

<b>${familyMessages[i].student}</b>

<br><br>

${familyMessages[i].text}

</div>

`;

}

}

document.getElementById("inside").innerHTML=html;

}


function sendFamilyMessage(){

let studentIndex=
document.getElementById("familyStudent").value;

let message=
document.getElementById("familyMessage").value.trim();

/* =========================
پیام مخصوص فرزند انتخاب‌شده
========================= */

function showParentMessages(){

if(selectedChildIndex===null){

alert("لطفاً ابتدا فرزند را انتخاب کنید.");

return;
}

let childName=
students[selectedChildIndex].name;

let childMessages=
familyMessages.filter(function(message){

return message.student===childName;

});


if(childMessages.length===0){

document.getElementById("inside").innerHTML=`

<div class="notice">

📭 هنوز پیامی از طرف معلم برای
<b>${childName}</b>
ثبت نشده است.

</div>

`;

return;
}


let html=`

<h3>💬 پیام‌های معلم</h3>

<p class="small">
پیام‌های مربوط به ${childName}
</p>

`;

for(let i=0;i<childMessages.length;i++){

html+=`

<div class="message">

<b>
👩‍🏫 پیام برای ${childName}
</b>

<br><br>

${childMessages[i].text}

</div>

`;

}

document.getElementById("inside").innerHTML=html;

}


/* =========================
ثبت اطلاعیه
========================= */

function addAnnouncement(){

document.getElementById("inside").innerHTML=`

<h3>📝 ثبت اطلاعیه جدید</h3>

<textarea
id="announcement"
placeholder="متن اطلاعیه را بنویسید...">
</textarea>

<button class="green" onclick="saveAnnouncement()">
ثبت اطلاعیه
</button>

`;

}


function saveAnnouncement(){

let text=
document.getElementById("announcement").value.trim();

if(!text){

alert("لطفاً متن اطلاعیه را وارد کنید.");

return;
}

announcements.push(text);

notifications.push({

type:"اطلاعیه جدید",
text:text

});

saveData();

alert("اطلاعیه با موفقیت ثبت شد ✅");

showNotice();

}


/* =========================
درخواست والدین
========================= */

function requestBox(){

document.getElementById("inside").innerHTML=`

<h3>📩 ثبت درخواست</h3>

<textarea
id="req"
placeholder="درخواست خود را بنویسید...">
</textarea>

<button class="green" onclick="saveRequest()">
ثبت درخواست
</button>

`;

}


function saveRequest(){

let text=
document.getElementById("req").value.trim();

if(!text){

alert("لطفاً درخواست را بنویسید.");

return;
}

requests.push(text);

saveData();

alert("درخواست شما با موفقیت ثبت شد ✅");

document.getElementById("inside").innerHTML="";

}


/* =========================
درخواست‌های مدیریت
========================= */

function showRequests(){

let box=document.getElementById("inside");

if(requests.length===0){

box.innerHTML=`

<div class="notice">
هنوز درخواستی ثبت نشده است.
</div>

`;

return;
}

let html="<h3>📩 درخواست‌های والدین</h3>";

for(let i=0;i<requests.length;i++){

html+=`

<div class="notice">

<b>درخواست ${i+1}</b>

<br><br>

${requests[i]}

</div>

`;

}

box.innerHTML=html;

}
